<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="scripts/product.js" defer></script>
    <title>Product</title>
</head>

<body>
    <header class="titel">
        <a href="index.html">
            <h1>Fashion<span>R</span>US</h1>
        </a>
    </header>
    <main class="product">
        <section class="product-image">
            <img src="https://kea-alt-del.dk/t7/images/webp/640/1163.webp" alt="Jersey">
        </section>
        <section class="product-info">
            <div class="details">
                <p>Nike</p>
                <h2>
                    Sahara Team India Fanwear Round Neck Jersey - blue
                </h2>
                <p>895 kr</p>
            </div>
            <article class="buy-box">
                <div class="size">
                    <label>Choose a size</label>
                    <select>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                    </select>
                </div>
                <button>Add to basket</button>
            </article>
        </section>
    </main>

</body>

</html>
